services:

  web:
    image: hrmate-web
    build:
      context: .
    container_name: web
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hrmate-network

networks:
  hrmate-network:
    external: true
